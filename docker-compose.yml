services:
  hotel-booking-api:
    build: .
    container_name: hotel-booking-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      DB_HOST: hotel-booking-db
      DB_PORT: ${DB_CONTAINER_PORT}
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      # Live code: edits on your machine reload the API in the container
      - ./src:/app/src
      - ./nodemon.json:/app/nodemon.json
    depends_on:
      hotel-booking-db:
        condition: service_healthy
    networks:
      - hotel-booking-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hotel-booking-rdbms
    restart: always
    environment:
      TZ: UTC
      PGADMIN_LISTEN_PORT: ${PGADMIN_CONTAINER_PORT}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT}:${PGADMIN_CONTAINER_PORT}"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      hotel-booking-db:
        condition: service_healthy
    networks:
      - hotel-booking-network

volumes:
  pg_data:
  pgadmin_data:

networks:
  hotel-booking-network:
    driver: bridge
